              # Generate checksums
              sha256sum erlang-${OTP_VERSION}-linux-amd64.tar.gz > checksums-${DISTRO}-amd64.txt
              sha256sum *.rpm >> checksums-${DISTRO}-amd64.txt 2>/dev/null || true
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-${{ matrix.distro }}-amd64
          path: |
            erlang-*.tar.gz
            *.rpm
            checksums-*.txt

  # ====================
  # Linux ARM64 Builds (Rocky Linux via Docker on native ARM64)
  # ====================
  build-rocky-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            distro: rocky9
          - image: rockylinux/rockylinux:10
            distro: rocky10

    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in Rocky Linux container (ARM64)
