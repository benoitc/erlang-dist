  # ====================
  # macOS Builds
  # ====================
  build-macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # OpenSSL is linked statically so crypto does not depend on Homebrew
      OPENSSL_VERSION: "3.5.9"
      OPENSSL_SHA256: "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf wxwidgets fop

      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-arm64

      - name: Build static OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          curl -fSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | shasum -a 256 -c
          tar xzf openssl.tar.gz
          cd openssl-${OPENSSL_VERSION}
          # No config file is shipped; point OPENSSLDIR at a path nothing else uses
          ./Configure darwin64-arm64-cc no-shared no-tests no-docs \
            --prefix=${{ runner.temp }}/openssl \
            --openssldir=/usr/local/lib/erlang/ssl
          make -j$(sysctl -n hw.ncpu) build_libs
          make install_dev

      - name: Download OTP source
        run: |
          curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
            -o otp_src.tar.gz
          tar xzf otp_src.tar.gz
          mv otp_src_${OTP_VERSION} otp_src

      - name: Build OTP
        run: |
          cd otp_src
          export ERL_TOP=$(pwd)
          ./configure \
            --prefix=/usr/local \
            --enable-threads \
            --enable-smp-support \
            --enable-kernel-poll \
            --enable-ssl \
            --disable-dynamic-ssl-lib \
            --with-ssl=${{ runner.temp }}/openssl \
            --enable-jit
          make -j$(sysctl -n hw.ncpu)

      - name: Create tarball
        run: |
          cd otp_src
          make DESTDIR=$(pwd)/../install install
          cd ../install
          tar czf ../erlang-${OTP_VERSION}-darwin-arm64.tar.gz .

      - name: Check for Homebrew dependencies
        run: |
          # Every binary must only link macOS system libraries
          BAD=$(find install -type f \( -name '*.so' -o -perm -u+x \) -print0 \
            | xargs -0 otool -L 2>/dev/null \
            | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Build links Homebrew libraries:"
            echo "$BAD"
            exit 1
          fi
          ERL_ROOTDIR=$PWD/install/usr/local/lib/erlang install/usr/local/lib/erlang/bin/erl -noshell -eval '
            {ok, _} = application:ensure_all_started(ssl),
            [{_, _, Lib}] = crypto:info_lib(),
            io:format("crypto: ~s~n", [Lib]),
            halt().'

      - name: Generate checksums
        run: |
          shasum -a 256 erlang-${OTP_VERSION}-darwin-arm64.tar.gz > checksums-darwin-arm64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-macos-arm64
          path: |
            erlang-*.tar.gz
            checksums-*.txt

  # ====================
  # Windows (official Erlang/OTP x64 build, verified and tested)
  # ====================
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Download official Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="OTP-${OTP_VERSION}"
          for EXT in zip exe; do
            NAME="otp_win64_${OTP_VERSION}.${EXT}"
            DIGEST=$(gh api "repos/erlang/otp/releases/tags/${TAG}" \
              -q ".assets[] | select(.name == \"${NAME}\") | .digest" | sed 's/^sha256://')
            if [ -z "$DIGEST" ]; then
              echo "::error::${NAME} not found on erlang/otp ${TAG}"
              exit 1
            fi
            curl -fSL "https://github.com/erlang/otp/releases/download/${TAG}/${NAME}" \
              -o "erlang-${OTP_VERSION}-windows-amd64.${EXT}"
            echo "${DIGEST}  erlang-${OTP_VERSION}-windows-amd64.${EXT}" | sha256sum -c
          done

      - name: Test the zip
        shell: pwsh
        run: |
          Expand-Archive "erlang-$env:OTP_VERSION-windows-amd64.zip" -DestinationPath erl-test
          $root = (Resolve-Path erl-test).Path
          if (Test-Path "$root\Install.exe") { & "$root\Install.exe" -minimal $root | Out-Null }
          & "$root\bin\erl.exe" -noshell -eval '{ok, _} = application:ensure_all_started(ssl), [{_, _, Lib}] = crypto:info_lib(), io:format("OTP ~s, ~s~n", [erlang:system_info(otp_release), Lib]), halt().'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum erlang-${OTP_VERSION}-windows-amd64.* > checksums-windows-amd64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-windows-amd64
          path: |
            erlang-*-windows-amd64.zip
            erlang-*-windows-amd64.exe
            checksums-*.txt

  # ====================
  # Create Release
  # ====================
  release:
    needs: [build-ubuntu-amd64, build-ubuntu-arm64, build-debian, build-rocky-amd64, build-rocky-arm64, build-centos-amd64, build-centos-arm64, build-macos, build-windows]
    if: ${{ !inputs.skip_release && always() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*-darwin-*.tar.gz" -o -name "*-windows-*" \) -exec cp {} release/ \;

          # Every Linux job builds a linux-<arch> tarball; ship the one built on the
          # oldest glibc (Ubuntu 22.04) so it runs on all supported distros
          for arch in amd64 arm64; do
            for src in ubuntu2204 ubuntu2404 debian12; do
              f="artifacts/erlang-${src}-${arch}/erlang-${OTP_VERSION}-linux-${arch}.tar.gz"
              if [ -f "$f" ]; then
                cp "$f" release/
                echo "linux-${arch} tarball from ${src}"
                break
              fi
            done
          done

      - name: Merge checksums
        run: |
          # Checksum the files actually shipped (each job builds its own tarball)
          (cd release && sha256sum *.tar.gz *.deb *.rpm *.zip *.exe 2>/dev/null) > SHA256SUMS
          mv SHA256SUMS release/

      - name: Update versions.json
        run: |
          # Function to compare versions (returns 0 if $1 > $2)
          version_gt() {
            test "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" && test "$1" != "$2"
          }

          MAJOR_VERSION="${OTP_VERSION%%.*}"

          if [ -f versions.json ]; then
            # Add version if not already present
            if ! jq -e ".versions | index(\"${OTP_VERSION}\")" versions.json > /dev/null; then
              jq ".versions += [\"${OTP_VERSION}\"]" versions.json > versions.json.tmp
              mv versions.json.tmp versions.json
            fi

            # Update latest for this major version
            CURRENT_LATEST=$(jq -r ".latest_${MAJOR_VERSION} // \"\"" versions.json)
            if [ -z "$CURRENT_LATEST" ] || version_gt "$OTP_VERSION" "$CURRENT_LATEST"; then
              jq ".latest_${MAJOR_VERSION} = \"${OTP_VERSION}\"" versions.json > versions.json.tmp
              mv versions.json.tmp versions.json
            fi

            # Update overall latest (highest version)
            CURRENT_OVERALL=$(jq -r ".latest // \"\"" versions.json)
            if [ -z "$CURRENT_OVERALL" ] || version_gt "$OTP_VERSION" "$CURRENT_OVERALL"; then
              jq ".latest = \"${OTP_VERSION}\"" versions.json > versions.json.tmp
              mv versions.json.tmp versions.json
            fi

            # Sort versions
            jq '.versions |= (. | sort_by(. | split(".") | map(tonumber? // .)))' versions.json > versions.json.tmp
            mv versions.json.tmp versions.json
          else
            echo '{"versions": ["'"${OTP_VERSION}"'"], "latest": "'"${OTP_VERSION}"'", "latest_'"${MAJOR_VERSION}"'": "'"${OTP_VERSION}"'"}' > versions.json
          fi
          cp versions.json release/

      - name: Commit versions.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if ! git diff --staged --quiet; then
            git commit -m "Update versions.json for OTP ${OTP_VERSION}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: List release artifacts
        run: ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OTP-${{ env.OTP_VERSION }}
          name: Erlang/OTP ${{ env.OTP_VERSION }}
          body: |
            ## Erlang/OTP ${{ env.OTP_VERSION }}

            Pre-built binaries for multiple platforms.

            ### Quick Install

            ```bash
            curl -fsSL https://${{ github.repository_owner }}.github.io/erlang-dist/install.sh | sh -s -- ${{ env.OTP_VERSION }}
            ```

            ### Available Packages

            **Linux (amd64 & arm64):**
            - Ubuntu 22.04, 24.04, 26.04 (.deb)
            - Debian 12, 13 (.deb)
            - Rocky Linux 9, 10, CentOS Stream 9, 10 (.rpm)
            - Generic tarball

            **macOS:**
            - Apple Silicon (arm64) tarball

            **Windows:**
            - x64 installer (.exe) and zip, the official Erlang/OTP builds

            ### Verification

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            release/*
          draft: false
          prerelease: ${{ contains(env.OTP_VERSION, 'rc') }}

      - name: Trigger APT repository update
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: update-apt
          client-payload: '{"otp_version": "${{ env.OTP_VERSION }}"}'

      - name: Trigger RPM repository update
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: update-rpm
          client-payload: '{"otp_version": "${{ env.OTP_VERSION }}"}'
