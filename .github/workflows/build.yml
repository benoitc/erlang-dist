name: Build Erlang/OTP

on:
  workflow_dispatch:
    inputs:
      otp_version:
        description: 'OTP version to build (e.g., 27.0, 28.0-rc1)'
        required: true
        type: string
      skip_release:
        description: 'Skip creating GitHub release (for testing)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [build-otp]

env:
  OTP_VERSION: ${{ inputs.otp_version || github.event.client_payload.otp_version || '27.0' }}

jobs:
  # ====================
  # Linux AMD64 Builds (Native Ubuntu)
  # ====================
  build-ubuntu-amd64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            distro: ubuntu2204
          - os: ubuntu-24.04
            distro: ubuntu2404
          - os: ubuntu-26.04
            distro: ubuntu2604

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            curl \
            libncurses-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libssh-dev \
            unixodbc-dev \
            xsltproc \
            fop \
            libxml2-utils \
            dpkg-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev || true

      - name: Download OTP source
        run: |
          curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
            -o otp_src.tar.gz
          tar xzf otp_src.tar.gz
          mv otp_src_${OTP_VERSION} otp_src

      - name: Build OTP
        run: |
          cd otp_src
          export ERL_TOP=$(pwd)
          ./configure \
            --prefix=/usr/local \
            --enable-threads \
            --enable-smp-support \
            --enable-kernel-poll \
            --enable-ssl \
            --enable-dynamic-ssl-lib \
            --with-ssl \
            --enable-jit
          make -j$(nproc)

      - name: Install to staging directory
        run: |
          cd otp_src
          make DESTDIR=$(pwd)/../install install

      - name: Create tarball
        run: |
          cd install
          tar czf ../erlang-${OTP_VERSION}-linux-amd64.tar.gz .

      - name: Create .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh ${OTP_VERSION} amd64 ${{ matrix.distro }}
          mv *.deb erlang-${OTP_VERSION}-${{ matrix.distro }}-amd64.deb || true

      - name: Generate checksums
        run: |
          sha256sum erlang-${OTP_VERSION}-linux-amd64.tar.gz > checksums-${{ matrix.distro }}-amd64.txt
          sha256sum *.deb >> checksums-${{ matrix.distro }}-amd64.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-${{ matrix.distro }}-amd64
          path: |
            erlang-*.tar.gz
            *.deb
            checksums-*.txt

  # ====================
  # Linux ARM64 Builds (Native GitHub ARM64 runners)
  # ====================
  build-ubuntu-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            distro: ubuntu2204
          - os: ubuntu-24.04-arm
            distro: ubuntu2404
          - os: ubuntu-26.04-arm
            distro: ubuntu2604

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            curl \
            libncurses-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libssh-dev \
            unixodbc-dev \
            xsltproc \
            fop \
            libxml2-utils \
            dpkg-dev
          sudo apt-get install -y libwxgtk3.2-dev || sudo apt-get install -y libwxgtk3.0-gtk3-dev || true

      - name: Download OTP source
        run: |
          curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
            -o otp_src.tar.gz
          tar xzf otp_src.tar.gz
          mv otp_src_${OTP_VERSION} otp_src

      - name: Build OTP
        run: |
          cd otp_src
          export ERL_TOP=$(pwd)
          ./configure \
            --prefix=/usr/local \
            --enable-threads \
            --enable-smp-support \
            --enable-kernel-poll \
            --enable-ssl \
            --enable-dynamic-ssl-lib \
            --with-ssl
          make -j$(nproc)

      - name: Install to staging directory
        run: |
          cd otp_src
          make DESTDIR=$(pwd)/../install install

      - name: Create tarball
        run: |
          cd install
          tar czf ../erlang-${OTP_VERSION}-linux-arm64.tar.gz .

      - name: Create .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh ${OTP_VERSION} arm64 ${{ matrix.distro }}
          mv *.deb erlang-${OTP_VERSION}-${{ matrix.distro }}-arm64.deb || true

      - name: Generate checksums
        run: |
          sha256sum erlang-${OTP_VERSION}-linux-arm64.tar.gz > checksums-${{ matrix.distro }}-arm64.txt
          sha256sum *.deb >> checksums-${{ matrix.distro }}-arm64.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-${{ matrix.distro }}-arm64
          path: |
            erlang-*.tar.gz
            *.deb
            checksums-*.txt

  # ====================
  # Linux Builds (Debian containers)
  # ====================
  build-debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 11 is end of life: no new builds, existing packages stay in apt-debian11
          - container: debian:12
            distro: debian12
            arch: amd64
            runner: ubuntu-24.04
          - container: debian:12
            distro: debian12
            arch: arm64
            runner: ubuntu-24.04-arm
          - container: debian:13
            distro: debian13
            arch: amd64
            runner: ubuntu-24.04
          - container: debian:13
            distro: debian13
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}

    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential \
            autoconf \
            libncurses-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libssh-dev \
            unixodbc-dev \
            xsltproc \
            fop \
            libxml2-utils \
            dpkg-dev
          apt-get install -y libwxgtk3.2-dev || apt-get install -y libwxgtk3.0-gtk3-dev || true

      - name: Download OTP source
        run: |
          curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
            -o otp_src.tar.gz
          tar xzf otp_src.tar.gz
          mv otp_src_${OTP_VERSION} otp_src

      - name: Build OTP
        run: |
          cd otp_src
          export ERL_TOP=$(pwd)
          ./configure \
            --prefix=/usr/local \
            --enable-threads \
            --enable-smp-support \
            --enable-kernel-poll \
            --enable-ssl \
            --enable-dynamic-ssl-lib \
            --with-ssl \
            --enable-jit
          make -j$(nproc)

      - name: Install to staging directory
        run: |
          cd otp_src
          make DESTDIR=$(pwd)/../install install

      - name: Create tarball
        run: |
          cd install
          tar czf ../erlang-${OTP_VERSION}-linux-${{ matrix.arch }}.tar.gz .

      - name: Create .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh ${OTP_VERSION} ${{ matrix.arch }} ${{ matrix.distro }}
          mv *.deb erlang-${OTP_VERSION}-${{ matrix.distro }}-${{ matrix.arch }}.deb || true

      - name: Generate checksums
        run: |
          sha256sum erlang-${OTP_VERSION}-linux-${{ matrix.arch }}.tar.gz > checksums-${{ matrix.distro }}-${{ matrix.arch }}.txt
          sha256sum *.deb >> checksums-${{ matrix.distro }}-${{ matrix.arch }}.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: erlang-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            erlang-*.tar.gz
            *.deb
            checksums-*.txt

  # ====================
  # Linux AMD64 Builds (Rocky Linux via Docker)
  # ====================
  build-rocky-amd64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:9
            distro: rocky9
          - image: rockylinux/rockylinux:10
            distro: rocky10

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build in Rocky Linux container
        run: |
          docker pull ${{ matrix.image }}
          docker run --rm -t \
            -v "$PWD:/src" -w /src \
            -e OTP_VERSION=${OTP_VERSION} \
            -e DISTRO=${{ matrix.distro }} \
            ${{ matrix.image }} bash -lc '
              set -euo pipefail


              # Clean and refresh repos
              dnf -y clean all
              dnf -y makecache --refresh

              # Enable CRB repo (needed for some devel packages)
              dnf -y install dnf-plugins-core
              dnf -y config-manager --set-enabled crb || true

              # Install build dependencies (--allowerasing to handle curl-minimal conflict)
              dnf -y install epel-release || true
              dnf -y install --allowerasing \
                gcc gcc-c++ make \
                autoconf \
                ncurses-devel \
                openssl-devel \
                mesa-libGL-devel \
                mesa-libGLU-devel \
                libpng-devel \
                libssh-devel \
                unixODBC-devel \
                libxslt \
                rpm-build \
                perl \
                tar \
                curl
              dnf -y install wxGTK3-devel fop || true

              # Download OTP source
              curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
                -o otp_src.tar.gz
              tar xzf otp_src.tar.gz
              mv otp_src_${OTP_VERSION} otp_src

              # Build OTP
