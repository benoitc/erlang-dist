                autoconf \
                ncurses-devel \
                openssl-devel \
                mesa-libGL-devel \
                mesa-libGLU-devel \
                libpng-devel \
                libssh-devel \
                unixODBC-devel \
                libxslt \
                rpm-build \
                perl \
                tar \
                curl
              dnf -y install wxGTK3-devel fop || true

              # Download OTP source
              curl -fSL "https://github.com/erlang/otp/releases/download/OTP-${OTP_VERSION}/otp_src_${OTP_VERSION}.tar.gz" \
                -o otp_src.tar.gz
              tar xzf otp_src.tar.gz
