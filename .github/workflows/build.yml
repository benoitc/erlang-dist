  build-centos-arm64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quay.io/centos/centos:stream9
            distro: cs9
          - image: quay.io/centos/centos:stream10
            distro: cs10

    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS container (ARM64)
        run: |
          docker pull ${{ matrix.image }}
          docker run --rm -t \
            -v "$PWD:/src" -w /src \
