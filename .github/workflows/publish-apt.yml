name: Publish APT Repository

# The APT indexes live on the apt-<distro> releases; packages stay on the
# OTP-<version> releases. Nothing is written to gh-pages.

on:
  repository_dispatch:
    types: [update-apt]
  workflow_dispatch:
    inputs:
      otp_version:
        description: 'OTP version to add (latest release if empty)'
        required: false
        type: string
      rebuild:
        description: 'Rebuild the indexes from all OTP releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish-apt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Get OTP versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            VERSIONS=$(gh release list --limit 1000 --json tagName -q '.[].tagName' | grep '^OTP-' | sed 's/^OTP-//' | sort -V | tr '\n' ' ')
          elif [ -n "${{ inputs.otp_version }}" ]; then
            VERSIONS="${{ inputs.otp_version }}"
          elif [ -n "${{ github.event.client_payload.otp_version }}" ]; then
            VERSIONS="${{ github.event.client_payload.otp_version }}"
          else
            VERSIONS=$(gh api repos/${{ github.repository }}/releases/latest -q '.tag_name' | sed 's/^OTP-//')
          fi
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Update APT indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [ "${{ inputs.rebuild }}" = "true" ] && FLAGS="--rebuild"
          ./scripts/apt-index.sh $FLAGS ${{ steps.version.outputs.versions }}

      - name: Summary
        run: |
          echo "## APT Repository Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Indexed OTP ${{ steps.version.outputs.versions }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# distro: ubuntu2204, ubuntu2404, debian11, debian12' >> $GITHUB_STEP_SUMMARY
          echo 'echo "deb [trusted=yes] https://github.com/${{ github.repository }}/releases/download/ apt-ubuntu2404/" | sudo tee /etc/apt/sources.list.d/erlang-dist.list' >> $GITHUB_STEP_SUMMARY
          echo 'sudo apt update && sudo apt install erlang-29' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
