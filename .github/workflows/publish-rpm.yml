name: Publish RPM Repository

# gh-pages only holds the repodata; package locations point at the
# OTP-<version> release assets.

on:
  repository_dispatch:
    types: [update-rpm]
  workflow_dispatch:
    inputs:
      otp_version:
        description: 'OTP version to add (latest release if empty)'
        required: false
        type: string
      rebuild:
        description: 'Rebuild the repodata from all OTP releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish-rpm:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Partial, sparse checkout: never fetch package blobs left in the gh-pages history
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /rpm/*.repo
            /rpm/*/repodata/
            /rpm/*/*/repodata/
            /apt/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c apt-utils

      - name: Get OTP versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            VERSIONS=$(gh release list --limit 1000 --json tagName -q '.[].tagName' | grep '^OTP-' | sed 's/^OTP-//' | sort -V | tr '\n' ' ')
          elif [ -n "${{ inputs.otp_version }}" ]; then
            VERSIONS="${{ inputs.otp_version }}"
          elif [ -n "${{ github.event.client_payload.otp_version }}" ]; then
            VERSIONS="${{ github.event.client_payload.otp_version }}"
          else
            VERSIONS=$(gh api repos/${{ github.repository }}/releases/latest -q '.tag_name' | sed 's/^OTP-//')
          fi
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Update RPM repodata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          [ "${{ inputs.rebuild }}" = "true" ] && FLAGS="--rebuild"
          mkdir -p site/rpm
          ./scripts/rpm-index.sh $FLAGS site/rpm ${{ steps.version.outputs.versions }}

      - name: Update site files
        run: |
          cp install.sh versions.json pages/index.html site/
          cp rpm/erlang-dist.repo site/rpm/
          touch site/.nojekyll

          # Generic erlang-dist.repo uses el$releasever: serve the CentOS Stream builds.
          # Older generic .repo files used rpm/$releasever/$basearch and rpm/$basearch.
          for PAIR in el9:cs9 el10:cs10 9:cs9 10:cs10 .:cs9; do
            for ARCH in x86_64 aarch64; do
              SRC="site/rpm/${PAIR#*:}/$ARCH/repodata"
              DST="site/rpm/${PAIR%:*}/$ARCH"
              [ -d "$SRC" ] || continue
              rm -rf "$DST/repodata"
              mkdir -p "$DST"
              cp -r "$SRC" "$DST/"
            done
          done

          # The old APT repository (apt stable main) is empty and its Label changed:
          # apt update stops with an error showing where the repository moved.
          D=site/apt/dists/stable
          rm -rf site/apt
          mkdir -p $D/main/binary-amd64 $D/main/binary-arm64
          for A in amd64 arm64; do
            : > $D/main/binary-$A/Packages
            gzip -9kf $D/main/binary-$A/Packages
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=erlang-dist \
            -o "APT::FTPArchive::Release::Label=MOVED - see https://github.com/${{ github.repository }}#apt-repository-debianubuntu" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            release $D > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" $D/Release

          for DISTRO in rocky9 cs9 cs10; do
            cat > site/rpm/erlang-dist-${DISTRO}.repo << EOF
          [erlang-dist]
          name=Erlang Distribution for ${DISTRO} - \$basearch
          baseurl=https://${{ github.repository_owner }}.github.io/erlang-dist/rpm/${DISTRO}/\$basearch
          enabled=1
          gpgcheck=0
          EOF
          done

      - name: Drop package files from gh-pages
        working-directory: site
        run: |
          git rm -r -q --cached --sparse --ignore-unmatch packages
          git ls-files -z -- '*.rpm' '*.deb' | xargs -0 -r git rm -q --cached --sparse --

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Update RPM repository for OTP ${{ steps.version.outputs.versions }}"
            git push origin HEAD:gh-pages
          fi

      - name: Summary
        run: |
          echo "## RPM Repository Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Indexed OTP ${{ steps.version.outputs.versions }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo '# distro: rocky9, cs9, cs10' >> $GITHUB_STEP_SUMMARY
          echo 'sudo curl -fsSL https://${{ github.repository_owner }}.github.io/erlang-dist/rpm/erlang-dist-cs9.repo -o /etc/yum.repos.d/erlang-dist.repo' >> $GITHUB_STEP_SUMMARY
          echo 'sudo dnf install erlang-29' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
